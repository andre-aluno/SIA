services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: alocacao_professor_db
    environment:
      POSTGRES_USER: ${DB_USER:-alocacao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-senha_segura_123}
      POSTGRES_DB: ${DB_NAME:-alocacao_professor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-alocacao} -d ${DB_NAME:-alocacao_professor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # Backend Flask API
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alocacao_professor_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: app.py
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      DATABASE_URL: postgresql://${DB_USER:-alocacao}:${DB_PASSWORD:-senha_segura_123}@db:5432/${DB_NAME:-alocacao_professor}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
